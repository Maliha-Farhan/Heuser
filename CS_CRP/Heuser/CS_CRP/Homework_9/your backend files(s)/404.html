<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Volume Not Found | The Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --wood-deep: #160c07;
      --parchment: #f6efe2;
      --gold: #d4af37;
      --gold-burnished: #a67c1e;
      --ink: #20150f;
      --ink-muted: #5e4c3e;
      --amber-glow: rgba(235, 185, 95, 0.22);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, rgba(240, 207, 101, 0.12) 0%, transparent 60%),
                  linear-gradient(180deg, #1c0f08 0%, #120904 100%);
      color: var(--parchment);
      font-family: 'EB Garamond', Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .card-404 {
      background: var(--parchment);
      color: var(--ink);
      border: 1px solid #d6be96;
      border-radius: 12px;
      padding: 3rem 2.4rem;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px var(--amber-glow);
      position: relative;
    }
    .crest-tag {
      font-family: 'Cinzel', serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-burnished);
      margin-bottom: 0.5rem;
    }
    .num-404 {
      font-family: 'Cinzel', serif;
      font-size: clamp(3.2rem, 8vw, 4.8rem);
      font-weight: 700;
      line-height: 1;
      color: #7a201b;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      color: var(--ink);
      margin-bottom: 0.8rem;
    }
    p {
      font-size: 1.05rem;
      color: var(--ink-muted);
      line-height: 1.55;
      margin-bottom: 1.8rem;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.85rem 1.8rem;
      border-radius: 6px;
      color: #fff9ee;
      background: linear-gradient(135deg, #341d11 0%, #160c07 100%);
      border: 1px solid var(--gold);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
    }
    .btn-home:hover {
      background: linear-gradient(135deg, var(--gold-burnished) 0%, var(--gold) 100%);
      color: #120904;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(212, 175, 55, 0.5);
    }
    .catalogue-links {
      margin-top: 1.8rem;
      padding-top: 1.4rem;
      border-top: 1px dashed #d6be96;
      font-size: 0.92rem;
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }
    .catalogue-links a {
      color: #5e4c3e;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .catalogue-links a:hover {
      color: #7a201b;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card-404">
    <div class="crest-tag">Ex Libris · Lost Manuscript</div>
    <div class="num-404">404</div>
    <h1>Volume Not Found</h1>
    <p>
      The shelf or manuscript you are searching for does not exist in this library archive. It may have been relocated, uncatalogued, or misaddressed.
    </p>
    <a class="btn-home" href="/">
      <span>← Return to Library Home</span>
    </a>
    <div class="catalogue-links">
      <a href="/game">Volume I · Game</a>
      <span>·</span>
      <a href="/portfolio">Volume II · Portfolio</a>
      <span>·</span>
      <a href="/api">Volume III · PokéAPI</a>
    </div>
  </div>
</body>
</html>
